name: 新增 Logo
description: 建议收录公司、产品或组织的 Logo，并提供身份、版本、来源和分发依据。
title: '[新增] '
body:
  - type: input
    id: company
    attributes:
      label: 公司、产品或组织名称与官网
      placeholder: 中文品牌名；英文品牌名；官网 URL
    validations:
      required: true
  - type: dropdown
    id: entity-type
    attributes:
      label: 实体类型
      options:
        - 公司
        - 产品
        - 组织
        - 暂不确定
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Logo 的身份与版本
      description: 提供可核实的公司全称与来源，区分集团和运营主体；如果是产品，请说明所属公司。补充图形/字标/组合、语言、配色、当前或历史状态、背景及实际格式。不确定时直接说明。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 资源和来源页面
      description: 提供原始文件下载地址及官方品牌资源页等可核对链接。
    validations:
      required: true
  - type: textarea
    id: permission
    attributes:
      label: 允许分发的依据
      description: 提供许可或授权条款链接，并指出允许再次分发的具体条件；没有找到时请明确说明。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他说明
      description: 可补充所需版本、署名要求或使用限制。请勿上传私人授权文件或个人信息。
